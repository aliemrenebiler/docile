[project]
name = "docxer"
version = "0.1.0"
description = "Generate Word documents from JSON data and a styled .docx template"
requires-python = ">=3.10"
dependencies = ["docxtpl>=0.20"]

[project.scripts]
docxer = "docxer.cli:main"

[project.optional-dependencies]
dev = ["black"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docxer = ["examples/*"]

[tool.black]
line-length = 88
target-version = ["py310"]
